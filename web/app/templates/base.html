<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}GOLFITO{% endblock %}</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/static/icons/favicon-64.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GOLFITO">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121412" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/static/app.css">
{% block head %}{% endblock %}
</head>
<body>
<header class="top">
  {% if request.session.get("ok") %}
  <a class="brand" href="/"><img src="/static/icons/favicon-64.png" alt="" width="26" height="26">GOLFITO</a>
  <form method="post" action="/logout"><button class="link" type="submit">Salir</button></form>
  {% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
{% block scripts %}{% endblock %}
{% if request.session.get("ok") %}<script src="/static/pull.js"></script><script src="/static/confirm.js"></script>{% endif %}
</body>
</html>
