<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Golf{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
{% block head %}{% endblock %}
</head>
<body>
<header class="top">
  <a class="brand" href="/">Golf</a>
  {% if request.session.get("ok") %}
  <form method="post" action="/logout"><button class="link" type="submit">Salir</button></form>
  {% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
{% block scripts %}{% endblock %}
</body>
</html>
