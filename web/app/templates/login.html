{% extends "base.html" %}
{% block title %}Entrar · GOLFITO{% endblock %}
{% block content %}
<form class="login" method="post" action="/login" autocomplete="off">
  <img class="logo" src="/static/icons/icon-192.png" alt="" width="88" height="88">
  <h1>GOLFITO</h1>
  <input name="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8"
         placeholder="PIN" autofocus required aria-label="PIN">
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <button type="submit">Entrar</button>
</form>
{% endblock %}
